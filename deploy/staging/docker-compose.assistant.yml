# Staging credentials stay separate and remain mounted for cleanup while paused.
services:
  api:
    environment:
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ASSISTANT_BRIDGE_SECRET_FILE: /run/secrets/assistant_bridge_secret
      ELEVENLABS_API_KEY_FILE: /run/secrets/elevenlabs_api_key
    secrets: [assistant_bridge_secret, elevenlabs_api_key]
  office:
    environment:
      ASSISTANT_WORKSPACE_ALLOWLIST: ${ASSISTANT_WORKSPACE_ALLOWLIST:-}
      ASSISTANT_ENABLED: ${ASSISTANT_ENABLED:-false}
      ELEVENLABS_AGENT_ID: ${ELEVENLABS_AGENT_ID:-}
      ASSISTANT_GREETING_OVERRIDE: ${ASSISTANT_GREETING_OVERRIDE:-off}
      ELEVENLABS_API_KEY_FILE: /run/secrets/elevenlabs_api_key
      ASSISTANT_BRIDGE_SECRET_FILE: /run/secrets/assistant_bridge_secret
      ASSISTANT_CHECKPOINT_URL_FILE: /run/secrets/assistant_checkpoint_url
      LANGSMITH_API_KEY_FILE: /run/secrets/langsmith_api_key
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-genesy-office-assistant-staging}
      LANGSMITH_HIDE_INPUTS: "true"
      LANGSMITH_HIDE_OUTPUTS: "true"
      LANGCHAIN_CALLBACKS_BACKGROUND: "false"
    secrets: [elevenlabs_api_key, assistant_bridge_secret, assistant_checkpoint_url, langsmith_api_key]
secrets:
  elevenlabs_api_key:
    file: ${SECRETS_DIR:-./secrets}/elevenlabs_api_key
  assistant_bridge_secret:
    file: ${SECRETS_DIR:-./secrets}/assistant_bridge_secret
  assistant_checkpoint_url:
    file: ${SECRETS_DIR:-./secrets}/assistant_checkpoint_url
  langsmith_api_key:
    file: ${SECRETS_DIR:-./secrets}/langsmith_api_key
