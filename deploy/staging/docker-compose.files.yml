# Staging image store: Garage (S3-compatible, one node) on its own volume. deploy.sh adds this
# file (-f) once secrets/files.env exists (README "Image store"); without it file routes answer
# 503 as before. Production never uses it (its uploads go to B2, docker-compose.uploads.yml).
# The API writes inside Docker (http://files:3900); browsers only read, through Traefik on
# staging-files.genesy.app (GET/HEAD only), with links the API signs for that host.
x-files-env: &files-env
  B2_UPLOADS_ENDPOINT: http://files:3900
  B2_UPLOADS_PUBLIC_URL: https://staging-files.genesy.app
  B2_UPLOADS_REGION: garage
  B2_UPLOADS_BUCKET: genesy-staging
  B2_UPLOADS_KEY_ID: ${FILES_KEY_ID:?set FILES_KEY_ID in .env.staging (README "Image store")}
  B2_UPLOADS_APPLICATION_KEY_FILE: /run/secrets/files_secret_key

services:
  files:
    # v2.4.1, pushed 2026-09-08 (multi-arch index digest).
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    restart: unless-stopped
    # Root in the container (the named volume is root-owned) but with no capabilities.
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    cpu_shares: 256
    deploy: { resources: { limits: { cpus: "0.25", memory: 256M, pids: 256 } } }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3", compress: "true" }
    # GARAGE_RPC_SECRET, GARAGE_DEFAULT_ACCESS_KEY, GARAGE_DEFAULT_SECRET_KEY, GARAGE_DEFAULT_BUCKET.
    env_file: ${SECRETS_DIR:-./secrets}/files.env
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - files:/var/lib/garage
    networks: [internal, edge]
    labels:
      traefik.enable: "true"
      traefik.docker.network: ${TRAEFIK_NETWORK}
      traefik.http.routers.genesy-staging-files.rule: Host(`staging-files.genesy.app`) && (Method(`GET`) || Method(`HEAD`))
      traefik.http.routers.genesy-staging-files.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.genesy-staging-files.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
      traefik.http.routers.genesy-staging-files.middlewares: genesy-staging-allow,genesy-staging-noindex
      traefik.http.services.genesy-staging-files.loadbalancer.server.port: "3900"

  api:
    environment: *files-env
    secrets: [files_secret_key]
    depends_on:
      files: { condition: service_started }
  # Reseeds fetch AFM's photos into the store (cached there for the next reseed).
  seed:
    command: ["seed-demo", "--images"]
    environment: *files-env
    secrets: [files_secret_key]
  shop:
    environment:
      FILES_ORIGIN: https://staging-files.genesy.app
  office:
    environment:
      FILES_ORIGIN: https://staging-files.genesy.app

volumes:
  files: {}

secrets:
  files_secret_key:
    file: ${SECRETS_DIR:-./secrets}/files_secret_key
