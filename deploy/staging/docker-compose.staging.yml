# Genesy staging: API + own Postgres + Mailpit + the five apps, routed by the VPS's existing Traefik.
# Run from the repo root (see deploy/staging/README.md):
#   docker compose -f deploy/staging/docker-compose.staging.yml --env-file deploy/staging/.env.staging up -d
# Staging only: fake payments, mail caught by Mailpit, no prod secret anywhere.
name: genesy-staging

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

# Shared by every routed service. Each container declares the same two middlewares, so routing
# keeps working while any one container is down.
x-edge-labels: &edge-labels
  traefik.enable: "true"
  traefik.docker.network: ${TRAEFIK_NETWORK:?set TRAEFIK_NETWORK in .env.staging}
  traefik.http.middlewares.genesy-staging-noindex.headers.customresponseheaders.X-Robots-Tag: "noindex, nofollow"
  # Empty STAGING_IP_ALLOWLIST = open to everyone.
  traefik.http.middlewares.genesy-staging-allow.ipallowlist.sourcerange: ${STAGING_IP_ALLOWLIST:-0.0.0.0/0,::/0}

x-api-env: &api-env
  DATABASE_URL_FILE: /run/secrets/database_url
  CREDENTIALS_KEY_FILE: /run/secrets/credentials_key
  BIND_ADDR: 0.0.0.0:8080
  RUST_LOG: ${RUST_LOG:-genesy_360_api=info,tower_http=info}
  FRONTEND_URL: https://staging-office.genesy.app
  API_PUBLIC_URL: https://staging-api.genesy.app
  # Mailpit catches every mail; nothing leaves the VPS.
  SMTP_URL: smtp://mailpit:1025
  SMTP_ALLOW_INSECURE: "true"
  MAIL_FROM: Genesy Staging <no-reply@staging.genesy.app>
  MAIL_TRUSTED_SMTP_HOSTS: mailpit
  # Traefik replaces client-sent X-Forwarded-For, so the first entry is the real client.
  TRUST_PROXY_HEADERS: "true"
  # Boots only because the image is built with ALLOW_FAKE_PAYMENTS=1 (see apps/api/Dockerfile).
  PAYMENTS_PROVIDER: fake
  # Lets `seed-demo` write demo data; never set in production.
  GENESY_ALLOW_DEMO_SEED: "1"
  # Self-signup on, so testers can make their own workspace (API default: off).
  SIGNUP_ENABLED: ${SIGNUP_ENABLED:-true}

x-api-build: &api-build
  context: ../../apps/api
  args:
    ALLOW_FAKE_PAYMENTS: "1"

services:
  db:
    image: postgres:18.4-alpine3.24@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_USER: genesy
      POSTGRES_DB: genesy
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets: [db_password]
    volumes:
      # Postgres 18 images keep data under /var/lib/postgresql/18/docker.
      - pg:/var/lib/postgresql
    networks: [internal]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "genesy", "-d", "genesy"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  mailpit:
    <<: *hardening
    image: axllent/mailpit:v1.31.5@sha256:94f6b70c1436defae6799d9ac7ff0eeff9540465b842026d5cdb018f1c0234ea
    user: "65534:65534"
    environment:
      MP_MAX_MESSAGES: "2000"
    networks: [internal]
    # Inbox UI on the VPS loopback only; open it through an ssh tunnel (README).
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-18025}:8025"

  api:
    <<: *hardening
    build: *api-build
    image: genesy-staging/api:${GENESY_REF:-local}
    environment: *api-env
    secrets: [database_url, credentials_key]
    depends_on:
      db: { condition: service_healthy }
      mailpit: { condition: service_started }
    networks: [internal, edge]
    labels:
      <<: *edge-labels
      traefik.http.routers.genesy-staging-api.rule: Host(`staging-api.genesy.app`)
      traefik.http.routers.genesy-staging-api.entrypoints: ${TRAEFIK_ENTRYPOINT:?set TRAEFIK_ENTRYPOINT in .env.staging}
      traefik.http.routers.genesy-staging-api.tls.certresolver: ${TRAEFIK_CERTRESOLVER:?set TRAEFIK_CERTRESOLVER in .env.staging}
      traefik.http.routers.genesy-staging-api.middlewares: genesy-staging-allow,genesy-staging-noindex
      traefik.http.services.genesy-staging-api.loadbalancer.server.port: "8080"
      traefik.http.services.genesy-staging-api.loadbalancer.healthcheck.path: /healthz

  shop:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/images/next.Dockerfile
      args: { APP: shop }
    image: genesy-staging/shop:${GENESY_REF:-local}
    environment:
      API_URL: http://api:8080/v1
      SITE_URL: https://staging-shop.genesy.app
      # App key (scope catalog:read) made in the staging office; empty until then (shop answers 503).
      STOREFRONT_APP_KEY: ${STOREFRONT_APP_KEY:-}
      FILES_ORIGIN: ${FILES_ORIGIN:-}
    networks: [internal, edge]
    labels:
      <<: *edge-labels
      traefik.http.routers.genesy-staging-shop.rule: Host(`staging-shop.genesy.app`)
      traefik.http.routers.genesy-staging-shop.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.genesy-staging-shop.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
      traefik.http.routers.genesy-staging-shop.middlewares: genesy-staging-allow,genesy-staging-noindex
      traefik.http.services.genesy-staging-shop.loadbalancer.server.port: "3000"

  office:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/images/next.Dockerfile
      args:
        { APP: office, NEXT_PUBLIC_SHOP_URL: "https://staging-shop.genesy.app" }
    image: genesy-staging/office:${GENESY_REF:-local}
    environment:
      API_URL: http://api:8080/v1
    networks: [internal, edge]
    labels:
      <<: *edge-labels
      traefik.http.routers.genesy-staging-office.rule: Host(`staging-office.genesy.app`)
      traefik.http.routers.genesy-staging-office.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.genesy-staging-office.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
      traefik.http.routers.genesy-staging-office.middlewares: genesy-staging-allow,genesy-staging-noindex
      traefik.http.services.genesy-staging-office.loadbalancer.server.port: "3000"

  till:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/images/next.Dockerfile
      args: { APP: till }
    image: genesy-staging/till:${GENESY_REF:-local}
    environment:
      API_URL: http://api:8080/v1
    networks: [internal, edge]
    labels:
      <<: *edge-labels
      traefik.http.routers.genesy-staging-till.rule: Host(`staging-till.genesy.app`)
      traefik.http.routers.genesy-staging-till.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.genesy-staging-till.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
      traefik.http.routers.genesy-staging-till.middlewares: genesy-staging-allow,genesy-staging-noindex
      traefik.http.services.genesy-staging-till.loadbalancer.server.port: "3000"

  field:
    <<: *hardening
    build:
      context: ../..
      dockerfile: deploy/images/field.Dockerfile
      args: { VITE_DATA_MODE: demo, VITE_FEATURE_RESOURCES: "on" }
    image: genesy-staging/field:${GENESY_REF:-local}
    networks: [internal, edge]
    labels:
      <<: *edge-labels
      traefik.http.routers.genesy-staging-field.rule: Host(`staging-field.genesy.app`)
      traefik.http.routers.genesy-staging-field.entrypoints: ${TRAEFIK_ENTRYPOINT}
      traefik.http.routers.genesy-staging-field.tls.certresolver: ${TRAEFIK_CERTRESOLVER}
      traefik.http.routers.genesy-staging-field.middlewares: genesy-staging-allow,genesy-staging-noindex
      traefik.http.services.genesy-staging-field.loadbalancer.server.port: "8080"

  # Demo data for every app, on demand: `... --profile seed run --rm seed`.
  # Reset = `down -v`, `up -d --wait`, then this again (README "Reset").
  seed:
    profiles: [seed]
    image: genesy-staging/api:${GENESY_REF:-local}
    command: ["seed-demo"]
    environment: *api-env
    secrets: [database_url, credentials_key]
    depends_on:
      db: { condition: service_healthy }
    networks: [internal]
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

networks:
  internal: {}
  # The existing Traefik's network (created by Traefik's own stack, not by this file).
  edge:
    external: true
    name: ${TRAEFIK_NETWORK}

volumes:
  pg: {}

# Files made once on the VPS (README "One-time setup"); never committed.
secrets:
  db_password:
    file: ${SECRETS_DIR:-./secrets}/db_password
  database_url:
    file: ${SECRETS_DIR:-./secrets}/database_url
  credentials_key:
    file: ${SECRETS_DIR:-./secrets}/credentials_key
