# Field app: SPA files + same-origin /v1 forward to the API (the API sends no CORS headers).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 20m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location /v1/ {
        # Docker DNS, resolved per request: nginx starts even while the api container is down.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Hashed bundles never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # App shell and service worker: always revalidate so a deploy reaches clients.
    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        try_files $uri /index.html;
    }
}
