# Standard GitHub-hosted runners: public repo compute is free (README "CI runners and cost").
# Checks skip unchanged inputs since the last green main commit (deploy/ci/changes.sh).
# Image preparation reuses unchanged digests. Final images jobs publish; the VPS pulls.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push replaces the run in progress, on main too: the newest commit holds all older ones,
# and the base below is always a fully green commit, so nothing goes untested.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SQLX_OFFLINE: "true"
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  changes:
    # Same-repo pushes and PRs only: fork PRs get no CI minutes.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      base: ${{ steps.diff.outputs.base }}
      api: ${{ steps.diff.outputs.api }}
      web: ${{ steps.diff.outputs.web }}
      img_api: ${{ steps.diff.outputs.img_api }}
      img_web: ${{ steps.diff.outputs.img_web }}
    steps:
      # Full history without file contents: enough for the ancestor check and the file list.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - id: diff
        name: What changed since the last green commit?
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        # On main the base is the last green run, not the previous push: a cancelled run's
        # changes are still tested by the next one. No base found = everything runs.
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then base="$PR_BASE"; else
            base="$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --event push \
              --status success -L 1 --json headSha -q '.[0].headSha' || true)"
          fi
          echo "base=$base" | tee -a "$GITHUB_OUTPUT"
          bash deploy/ci/changes.sh "$base" HEAD | tee -a "$GITHUB_OUTPUT"
      # Seconds, and needs only bash, git, python3 and the docker CLI: cheaper here than in web.
      - name: Shell tests (deploy/)
        run: |
          for t in deploy/*.test.sh deploy/*/*.test.sh; do bash "$t"; done
          python3 -B -m unittest discover -s deploy/ci -p 'test_*.py'

  api-quality:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      # Same image as apps/api/Dockerfile.
      image: rust:1.99-slim-trixie
    env:
      CARGO_TARGET_DIR: /ci-target
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # zstd: the cache packs with it (gzip without it is slower and bigger).
      - run: command -v zstd > /dev/null || { apt-get update -qq && apt-get install -y -qq --no-install-recommends zstd > /dev/null; }
      # Dependencies only (the crate itself is cleaned out before saving), so the entry changes only
      # with Cargo.lock/Cargo.toml and stays ~1 GB of the repo's 10 GB.
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /ci-target
          key: api-clippy-rust1.99-${{ hashFiles('apps/api/Cargo.lock', 'apps/api/Cargo.toml') }}
          restore-keys: |
            api-clippy-rust1.99-
            api-deps-${{ hashFiles('apps/api/Cargo.lock', 'apps/api/Cargo.toml') }}-rust1.99
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Keep only dependencies in the cache
        if: github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        run: cargo clean -p genesy-360-api
      - if: github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /ci-target
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - id: audit
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/ci-tools
          key: cargo-audit-0.22.2
      # Own target dir: cargo-audit's build must not land in the dependency cache.
      - name: Known vulnerabilities
        run: |
          [ -x /opt/ci-tools/bin/cargo-audit ] \
            || CARGO_TARGET_DIR=/tmp/audit-target cargo install --locked --root /opt/ci-tools cargo-audit@0.22.2
          /opt/ci-tools/bin/cargo-audit audit
      - if: github.ref == 'refs/heads/main' && steps.audit.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /opt/ci-tools
          key: cargo-audit-0.22.2

  api-tests:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    container:
      # Same image as apps/api/Dockerfile.
      image: rust:1.99-slim-trixie
    services:
      # Throwaway DB on the job's private network (no host port); removed with the job.
      # Data in RAM and no crash safety: nothing here outlives the job.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: ci-only
          POSTGRES_INITDB_ARGS: >-
            --set fsync=off --set synchronous_commit=off
            --set full_page_writes=off --set max_connections=200
          # No SCRAM handshake per test connection (it runs in unoptimised test-build crypto).
          POSTGRES_HOST_AUTH_METHOD: trust
        # The full suite peaks at ~175 MB of RAM disk.
        options: >-
          --tmpfs /var/lib/postgresql:rw,size=1g
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci-only@postgres:5432/postgres
      CARGO_TARGET_DIR: /ci-target
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 zstd > /dev/null
      # Dependencies only (the crate itself is cleaned out before saving), so the entry changes only
      # with Cargo.lock/Cargo.toml and stays ~1 GB of the repo's 10 GB.
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /ci-target
          key: api-tests-rust1.99-${{ hashFiles('apps/api/Cargo.lock', 'apps/api/Cargo.toml') }}
          restore-keys: |
            api-tests-rust1.99-
            api-deps-${{ hashFiles('apps/api/Cargo.lock', 'apps/api/Cargo.toml') }}-rust1.99
      # Each shard verifies empty databases before migrating its own template1.
      - name: Integration test shard
        run: python3 ../../deploy/ci/api-shard.py ${{ matrix.shard }} 2
      - name: Library, binary, OpenAPI and documentation tests
        if: matrix.shard == 0
        run: |
          cargo test --lib --bins --test openapi --no-fail-fast
          cargo test --doc
      - name: OpenAPI spec is fresh
        if: matrix.shard == 0
        run: cargo test --test openapi committed_spec
      - name: No internal names in the spec
        if: matrix.shard == 0
        run: test "$(grep -ciE 'laravel|vimdesk' openapi.json)" = 0
      - name: Keep only dependencies in the cache
        if: matrix.shard == 0 && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        run: cargo clean -p genesy-360-api
      - if: matrix.shard == 0 && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            /usr/local/cargo/registry/index
            /usr/local/cargo/registry/cache
            /ci-target
          key: ${{ steps.deps.outputs.cache-primary-key }}

  web-quality:
    # Quality and development Strict Mode checks run once, beside browser shards.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      # Same version as @playwright/test in packages/e2e; browsers come preinstalled.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      # The field app's equipment and catalogue screens sit behind a build-time release flag; e2e checks them.
      VITE_FEATURE_RESOURCES: "on"
    steps:
      # Before checkout: without git it downloads a tarball, and generate:check needs git diff.
      - run: |
          if ! command -v git > /dev/null || ! command -v zstd > /dev/null; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends git zstd > /dev/null
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container runs as root on a checkout owned by the runner user; checkout marks it
      # safe only in a temporary HOME, so git diff in generate:check would see no repository.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      # The Playwright image's Node no longer ships corepack; install the pinned pnpm from package.json.
      - run: npm install -g "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      # --only: skip @genesy/api#openapi (it sets UPDATE_OPENAPI, which tests/openapi.rs
      # refuses under CI). Uses the committed openapi.json; the api job proves it fresh.
      - name: Generated API client matches openapi.json
        run: pnpm turbo run generate:check --filter=@genesy/api-client --only
      - name: Reviewed voice catalog matches OpenAPI and authorization sources
        run: pnpm --filter @genesy/office voice:check
      - name: Checkpoint schema matches pinned saver
        run: pnpm --filter @genesy/office exec node scripts/check-voice-schema.mjs
      - run: pnpm turbo run typecheck lint test build --filter='!@genesy/api' --concurrency=2
      - name: Browser shards cover the complete suite
        run: pnpm --filter @genesy/e2e exec node verify-shards.mjs playwright.config.ts 8
      - name: Secure form survives development Strict Mode
        run: pnpm --filter @genesy/e2e exec playwright test -c voice-dev.config.ts --workers=1
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-quality
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 7
      # No `pnpm store prune`: the store and the checkout sit on different filesystems, so the
      # install copies instead of hard-linking and prune would count every file as unused.
      - if: github.ref == 'refs/heads/main' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /pnpm-store
          key: ${{ steps.store.outputs.cache-primary-key }}

  web-browser:
    # Independent builds avoid a large build-artifact transfer on the critical path.
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    container:
      # Same version as @playwright/test in packages/e2e; browsers come preinstalled.
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      CI: "true"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      # The field app's equipment and catalogue screens sit behind a build-time release flag; e2e checks them.
      VITE_FEATURE_RESOURCES: "on"
    steps:
      # Before checkout: without git it downloads a tarball, and generate:check needs git diff.
      - run: |
          if ! command -v git > /dev/null || ! command -v zstd > /dev/null; then
            apt-get update -qq && apt-get install -y -qq --no-install-recommends git zstd > /dev/null
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container runs as root on a checkout owned by the runner user; checkout marks it
      # safe only in a temporary HOME, so git diff in generate:check would see no repository.
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - id: store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /pnpm-store
          key: pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-
      # The Playwright image's Node no longer ships corepack; install the pinned pnpm from package.json.
      - run: npm install -g "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - run: pnpm install --frozen-lockfile --store-dir /pnpm-store
      - run: pnpm turbo run build --filter='!@genesy/api' --concurrency=2
      - run: pnpm --filter @genesy/e2e e2e --shard=${{ matrix.shard }}/8 --workers=3
      - name: Published storefront design browser checks
        if: matrix.shard == 1
        run: pnpm --filter @genesy/e2e exec playwright test -c storefront-design.config.ts
      - name: Upload report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
          retention-days: 7

  stack-tests:
    # Each shard has a complete isolated stack; real expiry and cache waits stay intact.
    needs: changes
    if: needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      # Outside the checkout, so the cache below holds exactly this.
      CARGO_TARGET_DIR: /home/runner/stack-target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependencies only (the crate is cleaned out before saving), like the api job's, but its own
      # entry: a host build (not the rust container), so the paths differ.
      - id: deps
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            /home/runner/stack-target
          key: stack-deps-${{ hashFiles('apps/api/Cargo.lock', 'apps/api/Cargo.toml') }}-rust1.99
          restore-keys: stack-deps-
      - run: rustup toolchain install 1.99 --profile minimal && rustup default 1.99
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - id: store
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/pnpm-store
          key: stack-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: stack-pnpm-
      - run: npm install -g "pnpm@$(node -p 'require("./package.json").packageManager.split("@")[1]')"
      - run: pnpm install --frozen-lockfile --store-dir /home/runner/pnpm-store
      - run: pnpm --filter @genesy/e2e exec playwright install --with-deps chromium
      # Up, specs, down; any failed step, console error or failed request fails the job.
      - name: Full-stack test shard
        run: |
          trap 'pnpm --filter @genesy/e2e stack:down' EXIT
          pnpm --filter @genesy/e2e stack:up
          if [ "${{ matrix.shard }}" = 1 ]; then
            pnpm --filter @genesy/e2e exec node verify-shards.mjs playwright.stack.config.ts 2
          fi
          pnpm --filter @genesy/e2e stack:test --shard=${{ matrix.shard }}/2
      - name: Upload report, traces and stack logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stack-e2e-report-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            packages/e2e/playwright-report/
            packages/e2e/test-results/
            packages/e2e/.stack/*/logs/
          retention-days: 7
      - name: Keep only dependencies in the cache
        if: matrix.shard == 1 && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        working-directory: apps/api
        run: cargo clean -p genesy-360-api
      - if: matrix.shard == 1 && github.ref == 'refs/heads/main' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            /home/runner/stack-target
          key: ${{ steps.deps.outputs.cache-primary-key }}
      - if: matrix.shard == 1 && github.ref == 'refs/heads/main' && steps.store.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/runner/pnpm-store
          key: ${{ steps.store.outputs.cache-primary-key }}

  api:
    # Preserve required-check names; missing/failed children cannot become green through skips.
    needs: [changes, api-quality, api-tests]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGED: ${{ needs.changes.outputs.api == 'true' }}
      RESULT_0: ${{ needs['api-quality'].result }}
      RESULT_1: ${{ needs['api-tests'].result }}
    steps:
      - name: Every required check passed
        run: |
          if [ "$CHANGED" = true ]; then
            [ "$RESULT_0" = success ] && [ "$RESULT_1" = success ]
          else
            [ "$CHANGED" = false ] && [ "$RESULT_0" = skipped ] && [ "$RESULT_1" = skipped ]
          fi

  web:
    # Preserve required-check names; missing/failed children cannot become green through skips.
    needs: [changes, web-quality, web-browser]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGED: ${{ needs.changes.outputs.web == 'true' }}
      RESULT_0: ${{ needs['web-quality'].result }}
      RESULT_1: ${{ needs['web-browser'].result }}
    steps:
      - name: Every required check passed
        run: |
          if [ "$CHANGED" = true ]; then
            [ "$RESULT_0" = success ] && [ "$RESULT_1" = success ]
          else
            [ "$CHANGED" = false ] && [ "$RESULT_0" = skipped ] && [ "$RESULT_1" = skipped ]
          fi

  stack-e2e:
    # Preserve required-check names; missing/failed children cannot become green through skips.
    needs: [changes, stack-tests]
    if: ${{ !cancelled() && needs.changes.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CHANGED: ${{ needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' }}
      RESULT_0: ${{ needs['stack-tests'].result }}
    steps:
      - name: Every required check passed
        run: |
          if [ "$CHANGED" = true ]; then
            [ "$RESULT_0" = success ]
          else
            [ "$CHANGED" = false ] && [ "$RESULT_0" = skipped ]
          fi

  image-prepare:
    # Candidates can build during checks, but only promotion creates deployable SHA tags.
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        producer: [api-production, api-staging, web]
    env:
      GENESY_REF: ci-${{ github.run_id }}-${{ github.run_attempt }}
      BASE: ${{ needs.changes.outputs.base }}
      CHANGED: ${{ matrix.producer == 'web' && needs.changes.outputs.img_web || needs.changes.outputs.img_api }}
      PRODUCER: ${{ matrix.producer }}
      # The compose files need these to load; nothing is started here.
      TRAEFIK_NETWORK: unused
      TRAEFIK_ENTRYPOINT: unused
      TRAEFIK_CERTRESOLVER: unused
      MAIL_FROM: unused
      TRIVY_VERSION: 0.76.0
      TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
      # Identical to the binary in the SHA-verified upstream release archive.
      TRIVY_BINARY_SHA256: 1f889576636db0623539cb339df7d06c40ebf39e7919489eafa1160e29808f19
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - id: plan
        name: Resolve unchanged images or plan candidate build
        run: python3 deploy/ci/images.py plan "$PRODUCER"
      - name: Build
        if: steps.plan.outputs.mode == 'build'
        run: |
          docker buildx create --use --name genesy --driver docker-container \
            --driver-opt image=moby/buildkit:v0.34.0@sha256:b059f8d7226d0b326bc871af489a5dddf65e36af4d20d14251b072974d9ee87c
          python3 deploy/ci/images.py build "$PRODUCER"
      # Before the scan: the web images start (their own HEALTHCHECK turns healthy), and the Next
      # images carry no package managers (deploy/images/next.Dockerfile drops them).
      - name: Web images start, Next images have no package managers
        if: steps.plan.outputs.mode == 'build' && matrix.producer == 'web'
        run: |
          fail=0
          while read -r img; do
            case "$img" in
              */genesy-field:*) ;;
              *)
                docker run --rm --entrypoint sh "$img" -c '
                  found=0
                  for t in npm npx corepack yarn yarnpkg; do command -v "$t" && found=1; done
                  for d in /usr/local/lib/node_modules /opt/yarn-*; do [ -e "$d" ] && echo "$d" && found=1; done
                  exit "$found"' || { echo "FAIL $img: package manager left (above)"; fail=1; }
                ;;
            esac
            c="$(docker run -d "$img")"
            status=starting
            for _ in $(seq 18); do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$c")"
              [ "$status" = starting ] || break
              sleep 5
            done
            if [ "$status" = healthy ]; then echo "ok   $img healthy"; else
              echo "FAIL $img: $status"; docker logs --tail 30 "$c"; fail=1
            fi
            docker rm -f "$c" > /dev/null
          done < images.txt
          exit "$fail"
      - id: day
        if: steps.plan.outputs.mode == 'build'
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      # One vulnerability DB download a day instead of one per job (and fewer GHCR rate limits).
      - id: trivy-db
        if: steps.plan.outputs.mode == 'build'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
          restore-keys: trivy-db-
      - id: trivy-tool
        if: steps.plan.outputs.mode == 'build'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy
          key: trivy-tool-linux-amd64-${{ env.TRIVY_VERSION }}-${{ env.TRIVY_BINARY_SHA256 }}
      - name: Install Trivy
        if: steps.plan.outputs.mode == 'build'
        run: |
          if [ ! -f "$RUNNER_TEMP/trivy" ]; then
            for attempt in 1 2 3; do
              if timeout 60 docker pull --platform linux/amd64 "$TRIVY_IMAGE"; then break; fi
              [ "$attempt" != 3 ] || exit 1
              sleep 2
            done
            trivy_container="$(docker create --platform linux/amd64 "$TRIVY_IMAGE")"
            trap 'docker rm -f "$trivy_container" > /dev/null' EXIT
            docker cp "$trivy_container:/usr/local/bin/trivy" "$RUNNER_TEMP/trivy"
          fi
          echo "$TRIVY_BINARY_SHA256  $RUNNER_TEMP/trivy" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/trivy"
      - if: steps.plan.outputs.mode == 'build' && steps.trivy-tool.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy
          key: trivy-tool-linux-amd64-${{ env.TRIVY_VERSION }}-${{ env.TRIVY_BINARY_SHA256 }}
      # Every image of the group is scanned before any is pushed. Accepted findings: .trivyignore.
      - name: Scan (HIGH or CRITICAL with a fix fails) and write SBOMs
        if: steps.plan.outputs.mode == 'build'
        run: |
          mkdir -p sbom
          fail=0
          while read -r img; do
            name="${img#ghcr.io/cotit/}"; name="${name%%:*}"
            case "$img" in *-staging) name="$name-staging" ;; esac
            "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln --severity HIGH,CRITICAL \
              --ignore-unfixed --exit-code 1 "$img" || fail=1
            "$RUNNER_TEMP/trivy" image --image-src docker --format cyclonedx --output "sbom/$name.cdx.json" "$img"
          done < images.txt
          exit "$fail"
      - if: steps.plan.outputs.mode == 'build' && steps.trivy-db.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ steps.day.outputs.day }}
      - name: Upload SBOMs
        if: steps.plan.outputs.mode == 'build' && (success() || failure())
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}-${{ matrix.producer }}-${{ github.run_attempt }}
          path: sbom/
          retention-days: 90
      - name: Push
        if: steps.plan.outputs.mode == 'build'
        run: |
          while read -r img; do docker push -q "$img"; done < images.txt
          python3 deploy/ci/images.py record "$PRODUCER"
      - name: Upload successful producer manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ github.run_id }}-${{ matrix.producer }}-${{ github.run_attempt }}
          path: ${{ matrix.producer }}.json
          if-no-files-found: error
          retention-days: 7
      - name: Log out
        if: always()
        run: docker logout ghcr.io || true

  images:
    # No final SHA tag exists until all tests and all candidate producers have succeeded.
    if: >-
      !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.result == 'success'
      && needs.api.result == 'success' && needs.web.result == 'success'
      && needs['stack-e2e'].result == 'success' && needs['image-prepare'].result == 'success'
    needs: [changes, api, web, stack-e2e, image-prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: api
            staging: api
            production: api
          - group: web
            staging: shop office till landing field
            production: office field
    env:
      GH_TOKEN: ${{ github.token }}
      TRAEFIK_NETWORK: unused
      TRAEFIK_ENTRYPOINT: unused
      TRAEFIK_CERTRESOLVER: unused
      MAIL_FROM: unused
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to GHCR
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
      - name: Validate every producer and promote reviewed digests
        run: python3 deploy/ci/images.py promote '${{ matrix.group }}'
      - name: Log out
        if: always()
        run: docker logout ghcr.io || true
