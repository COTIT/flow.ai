<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Office sign in</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./glass.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}">
<div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 24px">
  <div class="card glass-strong" style="width: min(440px, 100%); padding: 32px; gap: 20px">
    <img class="logo-l" src="/_blob/961aa98faa7be2bd8dbe24143ff25474" alt="Genesy" style="width: 168px; height: auto">
    <img class="logo-d" src="/_blob/6f1303279cddc88634ef9d67532e86eb" alt="Genesy" style="width: 168px; height: auto">
    <div class="gold-rule" style="width: 48px"></div>
    <div><h1 class="h2">Sign in to Office</h1><p class="small muted">Products, stock, orders, lots and the till — for your account.</p></div>
    <div class="notice n-info"><span class="chip-ic"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></span><div><p class="n-title">Your session ended</p><p class="n-body">Sign in again to continue where you were.</p></div></div>
    <label class="field"><span class="label">Email</span><span class="input">romeo@afm-honey.com</span></label>
    <label class="field"><span class="label">Password</span><span class="input">••••••••••••</span></label>
    <button class="btn btn-primary btn-lg btn-block" type="button">Sign in</button>
  </div>
  <div class="row gap-8">
    <button class="btn btn-ghost btn-sm" type="button"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path></svg>English</button>
    <button class="btn btn-ghost btn-sm" type="button"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg>Theme</button>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"mode":{"editor":"enum","options":["light","dark"],"default":"light"},"direction":{"editor":"enum","options":["a","b"],"default":"a"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    return { rootClass: 'g t-' + (this.props.mode ?? 'light') + ' dir-' + (this.props.direction ?? 'a') };
  }
}
</script>
</body>
</html>
