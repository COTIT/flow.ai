<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Office overview</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./glass.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}">
<div class="app">
  <aside class="side glass-strong">
    <div class="brand">
      <img class="logo-l" src="/_blob/961aa98faa7be2bd8dbe24143ff25474" alt="Genesy">
      <img class="logo-d" src="/_blob/6f1303279cddc88634ef9d67532e86eb" alt="Genesy">
    </div>
    <nav class="nav" aria-label="Main">
      <sc-for list="{{nav}}" as="n" hint-placeholder-count="10">
        <sc-if value="{{n.grp}}" hint-placeholder-val="{{ false }}"><p class="grp">{{n.grp}}</p></sc-if>
        <a href="#" class="{{n.cls}}"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="{{n.d}}"></path></svg>{{n.label}}<sc-if value="{{n.count}}" hint-placeholder-val="{{ false }}"><span class="count">{{n.count}}</span></sc-if></a>
      </sc-for>
    </nav>
    <div class="side-foot">
      <span class="avatar">RT</span>
      <div class="who grow"><p class="small" style="font-weight: 600">Romeo T.</p><p class="xs muted">AFM Honey · Owner</p></div>
      <button class="btn btn-ghost btn-icon btn-sm" type="button" aria-label="Sign out"><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"></path></svg></button>
    </div>
  </aside>

  <main class="main">
    <div class="mbar glass-strong">
      <button class="btn btn-ghost btn-icon" type="button" aria-label="Open menu"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
      <img class="logo-l" src="/_blob/961aa98faa7be2bd8dbe24143ff25474" alt="Genesy">
      <img class="logo-d" src="/_blob/6f1303279cddc88634ef9d67532e86eb" alt="Genesy">
      <span class="grow"></span>
      <button class="btn btn-ghost btn-icon" type="button" aria-label="Search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
      <span class="avatar">RT</span>
    </div>

    <div class="topbar glass-strong">
      <div class="crumbs"><span>AFM Honey</span><svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg><b>Overview</b></div>
      <span class="grow"></span>
      <span class="input search"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><span class="ph">Search products, orders, lots…</span></span>
      <button class="btn btn-outline" type="button">AFM Honey <svg class="i sm" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
      <button class="btn btn-ghost btn-icon" type="button" aria-label="Language">EN</button>
      <button class="btn btn-ghost btn-icon" type="button" aria-label="Switch theme"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"></path></svg></button>
    </div>
