# The stack's local S3 store (Garage, one node, in RAM): uploads and product images work with no
# internet. Stack only; staging and production use Backblaze B2. Secrets come from up.mjs.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
db_engine = "sqlite"
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_public_addr = "127.0.0.1:3901"

[s3_api]
s3_region = "garage"
api_bind_addr = "[::]:3900"
