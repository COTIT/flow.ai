<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body style="margin:0;padding:24px 12px;background:#f4f4f5;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;background:#ffffff;border-radius:6px;">
                <tr>
                    <td style="padding:24px 24px 8px;font-size:20px;font-weight:bold;">Control 360°</td>
                </tr>
                <tr>
                    <td style="padding:8px 24px 24px;font-size:14px;line-height:1.6;">{{ body|safe }}</td>
                </tr>
                {% if let Some((text, url)) = button %}
                <tr>
                    <td style="padding:0 24px 24px;">
                        <a href="{{ url }}" style="display:inline-block;padding:10px 18px;background:#FE5E17;color:#ffffff;border-radius:6px;text-decoration:none;font-size:14px;font-weight:bold;">{{ text }}</a>
                    </td>
                </tr>
                {% endif %}
                {% if !footer.is_empty() %}
                <tr>
                    <td style="padding:0 24px 24px;font-size:13px;line-height:1.5;">{{ footer|safe }}</td>
                </tr>
                {% endif %}
            </table>
            <p style="margin:16px 0 0;font-size:12px;color:#6b7280;">© {{ year }} Control 360° — COTIT. All rights reserved.</p>
        </td>
    </tr>
</table>
</body>
</html>
