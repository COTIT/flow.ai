[package]
name = "genesy-360-api"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
askama = { version = "0.16.1", default-features = false, features = ["derive", "std"] }
axum = { version = "0.8.9", features = ["multipart"] }
base64 = "0.22.1"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde", "clock", "std"] }
dotenvy = "0.15.7"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "hostname", "pool", "tokio1-rustls-tls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "multipart"] }
rust_decimal = { version = "1", default-features = false, features = ["std"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rusty-s3 = { version = "0.10.2", default-features = false, features = ["rustcrypto"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "rust_decimal", "sqlx-toml"] }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["limit", "set-header", "timeout", "trace"] }
tower_governor = { version = "0.8.0", default-features = false, features = ["axum"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.3.0"
uuid = { version = "1.28.0", features = ["serde", "v7"] }
webpki-roots = "1.0.10"
zeroize = "1.9.1"

[dev-dependencies]
http-body-util = "0.1.5"
jsonschema = { version = "0.59.0", default-features = false }
